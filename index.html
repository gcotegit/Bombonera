<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Partidos en La Bombonera</title>
  <style>
    :root {
      --bg-main: #050b18;
      --card-bg: #0d1b3e;
      --card-hover: #132450;
      --boca-gold: #ffc700;
      --boca-gold-dim: rgba(255, 199, 0, 0.15);
      --boca-blue: #003882;
      --boca-blue-dark: #001f4d;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
      --border-blue: #1b3570;
      --tag-rival: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      padding: 24px 16px 48px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge-top {
      display: inline-block;
      background: var(--boca-gold-dim);
      border: 1px solid var(--boca-gold);
      color: var(--boca-gold);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    header h1 {
      color: #ffffff;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    header h1 span {
      color: var(--boca-gold);
    }

    header p {
      color: var(--text-gray);
      font-size: 0.88rem;
      margin-top: 6px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      background: #09142b;
      border: 1px solid var(--border-blue);
      border-radius: 10px;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--boca-gold);
    }

    .year-filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }

    .year-filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      background: #0c1833;
      border: 1px solid var(--border-blue);
      color: var(--text-gray);
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--boca-gold);
      color: #071126;
      border-color: var(--boca-gold);
      font-weight: 700;
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--border-blue);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .match-card:hover {
      border-color: rgba(255, 199, 0, 0.6);
      box-shadow: 0 4px 18px rgba(0, 56, 130, 0.35);
    }

    .match-card.open {
      border-color: var(--boca-gold);
    }

    .match-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      user-select: none;
    }

    .match-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .match-meta {
      font-size: 0.74rem;
      color: var(--text-gray);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.4px;
    }

    .match-rival {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .score-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #08142d;
      border: 1px solid var(--border-blue);
      border-radius: 20px;
      padding: 6px 14px;
      flex-shrink: 0;
    }

    .score-text {
      color: var(--boca-gold);
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .arrow-icon {
      font-size: 0.75rem;
      color: var(--text-gray);
      transition: transform 0.25s ease;
    }

    .match-card.open .arrow-icon {
      transform: rotate(180deg);
      color: var(--boca-gold);
    }

    .match-details {
      display: none;
      background: #081329;
      border-top: 1px solid rgba(255, 199, 0, 0.15);
      padding: 16px;
    }

    .match-card.open .match-details {
      display: block;
    }

    .section-label {
      font-size: 0.72rem;
      color: var(--boca-gold);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    .goals-container {
      margin-bottom: 14px;
    }

    .goals-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .goal-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.86rem;
    }

    .goal-min {
      color: var(--boca-gold);
      font-weight: 700;
      min-width: 32px;
      font-size: 0.8rem;
    }

    .tag-team {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .tag-team.boca {
      background: var(--boca-blue);
      color: #fff;
    }

    .tag-team.rival {
      background: var(--tag-rival);
      color: #e2e8f0;
    }

    .goal-player {
      color: #f1f5f9;
    }

    .no-goals {
      font-size: 0.82rem;
      color: var(--text-gray);
      font-style: italic;
    }

    .match-story {
      font-size: 0.86rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-gray);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <span class="badge-top">Historial Personal</span>
      <h1>Mis Partidos en <span>La Bombonera</span></h1>
      <p>Tocá cualquier partido para ver los goles, autores, minutos y la crónica.</p>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar por rival o torneo..." oninput="handleFilter()">
      <div class="year-filter-bar" id="yearFilters">
        <button class="filter-btn active" onclick="setYear('todos')">Todos</button>
        <button class="filter-btn" onclick="setYear('2019')">2019</button>

        <button class="filter-btn" onclick="setYear('2025')">2025</button>
        <button class="filter-btn" onclick="setYear('2026')">2026</button>
      </div>
    </div>

    <div class="match-list" id="matchesContainer"></div>
  </div>

    let currentYear = 'todos';

    function setYear(year) {
      currentYear = year;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase() === year);
      });
      handleFilter();
    }

    function handleFilter() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = partidos.filter(p => {
        const matchesYear = currentYear === 'todos' || p.year === currentYear;
        const matchesQuery = p.rival.toLowerCase().includes(query) || p.torneo.toLowerCase().includes(query);
        return matchesYear && matchesQuery;
      });
      render(filtered);
    }

    function render(list) {
      const container = document.getElementById('matchesContainer');
      if (list.length === 0) {
        container.innerHTML = '<div class="empty-state">No se encontraron partidos con ese criterio en este año.</div>';
        return;
      }

      container.innerHTML = list.map(p => `
        <article class="match-card" onclick="this.classList.toggle('open')">
          <div class="match-header">
            <div class="match-info">
              <span class="match-meta">${p.fecha} • ${p.torneo}</span>
              <h2 class="match-rival">${p.rival}</h2>
            </div>
            <div class="score-badge">
              <span class="score-text">${p.marcador.split(' (')[0].replace('Boca ', '')}</span>
              <span class="arrow-icon">▼</span>
            </div>
          </div>
          <div class="match-details">
            <div class="section-label">Goles e Incidencias</div>
            <div class="goals-container">
              <ul class="goals-list">
                ${p.goles.length > 0
                  ? p.goles.map(g => `
                      <li class="goal-row">
                        <span class="goal-min">${g.minuto}</span>
                        <span>⚽</span>
                        <span class="tag-team ${g.equipo}">${g.equipo === 'boca' ? 'Boca' : p.rival.split(' ')[0]}</span>
                        <span class="goal-player">${g.jugador}</span>
                      </li>
                    `).join('')
                  : '<li class="no-goals">Sin goles convertidos</li>'
                }
              </ul>
            </div>
            <div class="section-label">Crónica del partido</div>
            <p class="match-story">${p.cronica}</p>
          </div>
        </article>
      `).join('');
    }

    render(partidos);
  </script>
</body>
</html>
